name: Desktop foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ngspice
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/verify_rc.py --output reports/rc.json
      - uses: actions/upload-artifact@v4
        with:
          name: rc-numerical-evidence
          path: reports/rc.json
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake qt6-base-dev qt6-tools-dev qt6-tools-dev-tools libqt6svg6-dev libqt6opengl6-dev flex bison gperf dos2unix ngspice
      - run: python3 scripts/build.py --jobs 2
      - run: test -x ./install/bin/qucs-s
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-build
          path: install/
