name: Desktop foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ngspice
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/verify_rc.py --output reports/rc.json
      - uses: actions/upload-artifact@v4
        with:
          name: rc-numerical-evidence
          path: reports/rc.json
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake qt6-base-dev qt6-tools-dev qt6-tools-dev-tools libqt6svg6-dev libqt6opengl6-dev flex bison gperf dos2unix ngspice xvfb xauth xdotool imagemagick openbox
      - run: python3 scripts/build.py --jobs 2
      - name: Confirm binary version
        run: QT_QPA_PLATFORM=offscreen ./install/bin/qucs-s --version
      - name: Export and validate RC schematic
        run: QT_QPA_PLATFORM=offscreen python3 scripts/verify_netlist.py --executable install/bin/qucs-s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schematic-export-evidence
          path: reports/netlist/
      - name: Simulate actual exported RC devices
        run: python3 scripts/verify_rc.py --netlist reports/netlist/rc-export.cir --output reports/exported-rc.json
      - uses: actions/upload-artifact@v4
        with:
          name: exported-rc-numerical-evidence
          path: reports/exported-rc.json
      - name: Capture actual X11 startup
        run: |
          xvfb-run -a -s "-screen 0 1440x1000x24" sh -c '
            openbox > /tmp/qucs-openbox.log 2>&1 &
            exec python3 scripts/verify_desktop.py --executable install/bin/qucs-s --schematic examples/rc.sch --save-copy reports/desktop/rc-saved.sch
          '
      - name: Reopen GUI-saved copy in a fresh desktop process
        run: |
          xvfb-run -a -s "-screen 0 1440x1000x24" sh -c '
            openbox > /tmp/qucs-reopen-openbox.log 2>&1 &
            exec python3 scripts/verify_desktop.py --executable install/bin/qucs-s --schematic reports/desktop/rc-saved.sch --output reports/desktop/reopened --simulation-output reports/desktop/rc-saved.dat.ngspice
          '
      - name: Validate GUI-saved circuit through editor export
        run: QT_QPA_PLATFORM=offscreen python3 scripts/verify_netlist.py --executable install/bin/qucs-s --schematic reports/desktop/rc-saved.sch --output reports/desktop/saved-netlist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-startup-evidence
          path: reports/desktop/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-build
          path: install/
